[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvd"
version = "0.1.0"
description = "Heart disease risk factors and prediction on BRFSS 2021 survey data"
requires-python = ">=3.12"
license = "MIT"
# Runtime dependencies are pinned in requirements.txt (compiled from requirements.in).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cvd"]
